<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">Class diagram of CampusMart core entities and their relationships</h2>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const def = `classDiagram
  class User {
    +Long id
    +String name
    +String email
    +String role
    +String hostelBlock
    +boolean verified
  }
  class Listing {
    +Long id
    +String title
    +BigDecimal price
    +String condition
    +String status
    +boolean negotiable
  }
  class Category {
    +Long id
    +String name
  }
  class ListingImage {
    +Long id
    +String url
  }
  class Wishlist {
    +Long id
    +LocalDateTime savedAt
  }
  class Conversation {
    +Long id
    +LocalDateTime startedAt
  }
  class Message {
    +Long id
    +String content
    +boolean isRead
  }
  class Transaction {
    +Long id
    +String status
    +LocalDateTime meetupTime
  }
  class Review {
    +Long id
    +int rating
    +String comment
  }
  class Notification {
    +Long id
    +String type
    +boolean isRead
  }
  class Report {
    +Long id
    +String reason
    +String status
  }

  User "1" --> "*" Listing : creates
  Listing "*" --> "1" Category : belongsTo
  Listing "1" --> "*" ListingImage : has
  User "1" --> "*" Wishlist : saves
  Wishlist "*" --> "1" Listing : bookmarks
  User "1" --> "*" Transaction : buys
  User "1" --> "*" Transaction : sells
  Transaction "*" --> "1" Listing : involves
  Transaction "1" --> "0..1" Review : generates
  User "1" --> "*" Review : writes
  User "1" --> "*" Conversation : joins
  Listing "1" --> "*" Conversation : discussedIn
  Conversation "1" --> "*" Message : contains
  User "1" --> "*" Message : sends
  User "1" --> "*" Notification : receives
  User "1" --> "*" Report : files
  Report "*" --> "1" Listing : targets
`;
const { svg } = await mermaid.render('cd-svg', def);
document.getElementById('cd').innerHTML = svg;

document.querySelectorAll('#cd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
</script>
